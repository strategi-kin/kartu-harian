<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Kartu Harian</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#EDE7D8">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE7D8;
    --paper-card:#FBF8F0;
    --ink:#242A20;
    --ink-soft:#5B5F52;
    --green:#33513A;
    --green-deep:#233A29;
    --green-wash:#E4EAE0;
    --ochre:#B4832C;
    --ochre-soft:#E9D9B4;
    --brick:#9C4130;
    --line: rgba(36,42,32,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color: transparent;
  }
  #app{
    width:100%;
    max-width:460px;
    padding:22px 18px 40px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1.5px solid var(--ink);
    padding-bottom:12px;
  }
  h1{
    font-family:'Bitter', serif;
    font-size:22px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  .streak{
    font-size:13px;
    color:var(--ink-soft);
    text-align:right;
    line-height:1.3;
  }
  .streak b{
    color:var(--ochre);
    font-family:'Bitter', serif;
    font-size:17px;
  }

  .dots-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .dots{
    display:flex;
    gap:5px;
    flex:1;
  }
  .dot{
    flex:1;
    height:7px;
    border-radius:4px;
    background:rgba(36,42,32,0.14);
    border:1px solid transparent;
  }
  .dot.filled{ background:var(--green); }
  .dot.current{ background:var(--ochre); }
  .dots-label{
    font-size:12px;
    color:var(--ink-soft);
    white-space:nowrap;
    font-variant-numeric: tabular-nums;
  }

  .chips-wrap{
    position:relative;
  }
  .chips{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    -ms-overflow-style:none;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chips-wrap::after{
    content:"";
    position:absolute;
    right:0; top:0; bottom:4px;
    width:28px;
    background:linear-gradient(to right, rgba(237,231,216,0), var(--paper));
    pointer-events:none;
  }
  .chip{
    flex:none;
    font-size:12.5px;
    padding:6px 12px;
    border:1.3px solid var(--line);
    border-radius:20px;
    color:var(--ink-soft);
    background:transparent;
    cursor:pointer;
    white-space:nowrap;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .chip.active{
    border-color:var(--ink);
    color:var(--ink);
    background:var(--ochre-soft);
    font-weight:600;
  }

  .session-note{
    font-size:12.5px;
    color:var(--ink-soft);
    background:var(--ochre-soft);
    border-radius:6px;
    padding:8px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .session-note button{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:12px;
    font-weight:600;
    border:1.3px solid var(--ink);
    background:transparent;
    color:var(--ink);
    padding:5px 10px;
    border-radius:14px;
    cursor:pointer;
    white-space:nowrap;
  }

  .stage{
    position:relative;
    min-height:300px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card{
    width:100%;
    background:var(--paper-card);
    border:1.6px solid var(--ink);
    border-radius:10px;
    box-shadow:4px 4px 0 rgba(36,42,32,0.14);
    padding:22px 20px 20px;
    display:flex;
    flex-direction:column;
    gap:0;
    min-height:250px;
    justify-content:center;
    cursor:pointer;
  }
  .card-eyebrow{
    font-size:11.5px;
    color:var(--ink-soft);
    border-bottom:1px solid var(--line);
    padding-bottom:9px;
    margin-bottom:16px;
  }

  .prompt-block{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .prompt-word{
    font-family:'Bitter', serif;
    font-size:22px;
    line-height:1.35;
    font-weight:700;
    color:var(--ink);
  }
  .prompt-example{
    font-size:14.5px;
    line-height:1.55;
    color:var(--ink-soft);
    padding-left:12px;
    border-left:2.5px solid var(--line);
    font-style:italic;
  }
  .card-hint{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:18px;
  }

  .card-en{
    display:none;
    border-top:1.4px dashed var(--line);
    padding-top:16px;
    margin-top:16px;
  }
  .card.flipped .card-en{ display:block; }
  .card.flipped .card-hint{ display:none; }

  .answer-block{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .en-word{
    font-family:'Bitter', serif;
    font-size:23px;
    font-weight:700;
    color:var(--green-deep);
  }
  .en-chunk{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:-4px;
  }
  .en-sentence{
    font-size:15.5px;
    line-height:1.55;
    color:var(--ink);
    background:var(--green-wash);
    padding:10px 12px;
    border-radius:6px;
    border-left:3px solid var(--green);
  }

  .speak-row{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .speak-btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    border:1.4px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    padding:8px 12px;
    border-radius:7px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .speak-btn:active{ transform:translateY(1px); }
  .speak-btn.slow{ color:var(--ink-soft); }

  .rate-row{
    display:flex;
    gap:10px;
  }
  .rate-btn{
    flex:1;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    font-weight:600;
    padding:13px 10px;
    border-radius:8px;
    border:1.6px solid var(--ink);
    cursor:pointer;
    background:var(--paper-card);
    color:var(--ink);
  }
  .rate-btn.got-it{
    background:var(--green);
    border-color:var(--green);
    color:#F4F1E6;
  }
  .rate-btn:disabled{ opacity:0.35; cursor:default; }

  .tap-instruction{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    min-height:16px;
  }
  .tap-instruction.praise{
    color:var(--green-deep);
    font-weight:600;
  }

  .done-panel{
    text-align:center;
    padding:20px 8px 6px;
  }
  .done-panel .badge{
    font-size:34px;
    line-height:1;
    margin-bottom:10px;
  }
  .done-panel h2{
    font-family:'Bitter', serif;
    font-size:21px;
    margin:0 0 8px;
  }
  .done-panel p{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0 0 18px;
    line-height:1.6;
  }
  .done-panel b{ color:var(--ochre); }
  .ghost-btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13.5px;
    font-weight:600;
    border:1.4px solid var(--ink);
    background:transparent;
    color:var(--ink);
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
  }

  footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top:1.5px solid var(--ink);
    padding-top:10px;
    font-size:12px;
    color:var(--ink-soft);
    gap:10px;
  }
  footer span{
    cursor:help;
  }
  .reset-link{
    color:var(--brick);
    background:none;
    border:none;
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
  }

  @keyframes pop{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.05); }
    100%{ transform:scale(1); }
  }
  .card.pop{ animation:pop .28s ease; }

  .loading-msg{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:40px 0;
  }
</style>
</head>
<body>
<div id="app">
  <div class="loading-msg" id="loading">Menyiapkan kartu hari ini...</div>
</div>

","en_chunk":null,"en_sentence":"you should take a rest"},{"id":193,"cat":"8 POWER SWITCHES","id_main":"Mungkin","id_example":"mungkin dia akan datang besok","en_word":"maybe / might","en_chunk":null,"en_sentence":"maybe he will come tomorrow"},{"id":194,"cat":"8 POWER SWITCHES","id_main":"boleh","id_example":"bolehkan saya masuk?","en_word":"may","en_chunk":null,"en_sentence":"may i come in ?"},{"id":195,"cat":"8 POWER SWITCHES","id_main":"Apakah sudah / tidak","id_example":"apakah kamu sudah melihatnya? saya tidak melihatnya","en_word":"Did / didn't","en_chunk":null,"en_sentence":"did you see it? / I didn't see it"},{"id":196,"cat":"8 POWER SWITCHES","id_main":"Adalah / Sedang","id_example":"saya sibuk / harganya mahal","en_word":"To be","en_chunk":"am/is/are","en_sentence":"I am busy / the price is expensive"}];

const STORAGE_KEY = "kartu-harian-progress-v3";
const DAILY_TARGET = 10;

const PRAISE_MSGS = ["Mantap!", "Bagus sekali!", "Terus lanjutkan!", "Nice, kamu makin lancar!", "Kerja bagus!"];
const AGAIN_MSGS = ["Santai, ulangi lagi nanti.", "Wajar, ini yang sedang dilatih.", "Oke, kartu ini akan muncul lagi."];
const DONE_MSGS = [
  "Konsistensi seperti ini yang bikin lancar bicara sama klien.",
  "10 kalimat hari ini, satu langkah lebih dekat ke Pare.",
  "Bahasa Inggris kerja itu dibangun dari kebiasaan kecil seperti ini.",
  "Rutinitas kecil, hasil besar. Sampai jumpa besok."
];

function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function yesterdayStr(){
  const d = new Date();
  d.setDate(d.getDate()-1);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function defaultProgress(){
  return {
    boxes: {},
    lastSeen: {},
    queueDate: null,
    queueIds: [],
    doneToday: [],
    streak: 0,
    lastCompletedDate: null
  };
}

let progress = null;
let deckFilter = "Semua";      // "Semua" = daily target deck; any other value = focused category session
let freeMode = false;           // unlocked after finishing daily target, practices full pool without a cap
let sessionQueue = [];          // active list of items for a focused/free session (not persisted)
let flipped = false;
let feedback = "";

const appEl = document.getElementById("app");

async function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ return Object.assign(defaultProgress(), JSON.parse(raw)); }
  }catch(e){ console.log("starting fresh", e); }
  return defaultProgress();
}
async function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }
  catch(e){ console.error("failed to save progress", e); }
}

function getCategories(){
  const set = [];
  RAW_DATA.forEach(it => { if(!set.includes(it.cat)) set.push(it.cat); });
  return set;
}
function shortCatLabel(cat){
  return cat.replace(/^\d+\s*/, "").replace(/^\w/, c => c.toUpperCase());
}
function itemsForFilter(filter){
  return filter === "Semua" ? RAW_DATA : RAW_DATA.filter(it => it.cat === filter);
}
function sortByWeakest(pool){
  return pool.slice().sort((a,b) => {
    const boxA = progress.boxes[a.id] || 1;
    const boxB = progress.boxes[b.id] || 1;
    if(boxA !== boxB) return boxA - boxB;
    const seenA = progress.lastSeen[a.id] || "";
    const seenB = progress.lastSeen[b.id] || "";
    return seenA.localeCompare(seenB);
  });
}
function buildDailyQueue(){
  const sorted = sortByWeakest(RAW_DATA);
  return shuffle(sorted.slice(0, DAILY_TARGET)).map(it => it.id);
}
function ensureTodayQueue(){
  const t = todayStr();
  if(progress.queueDate !== t){
    progress.queueDate = t;
    progress.queueIds = buildDailyQueue();
    progress.doneToday = [];
    freeMode = false;
  }
}
function inFocusedSession(){
  return deckFilter !== "Semua" || freeMode;
}
function startFocusedSession(){
  const pool = itemsForFilter(deckFilter);
  sessionQueue = shuffle(sortByWeakest(pool));
}
function currentQueueItems(){
  if(inFocusedSession()) return sessionQueue;
  const remaining = progress.queueIds.filter(id => !progress.doneToday.includes(id));
  return remaining.map(id => RAW_DATA.find(it => it.id === id)).filter(Boolean);
}
function speak(text, rate){
  if(!('speechSynthesis' in window)){ alert("Browser ini tidak mendukung pengucapan suara."); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "en-US";
  utter.rate = rate || 0.9;
  window.speechSynthesis.speak(utter);
}
function handleRate(item, gotIt){
  const box = progress.boxes[item.id] || 1;
  progress.boxes[item.id] = gotIt ? Math.min(box + 1, 3) : 1;
  progress.lastSeen[item.id] = todayStr();
  feedback = gotIt ? pick(PRAISE_MSGS) : pick(AGAIN_MSGS);

  if(inFocusedSession()){
    sessionQueue = sessionQueue.filter(it => it.id !== item.id);
  } else {
    progress.doneToday.push(item.id);
    if(progress.doneToday.length >= DAILY_TARGET){
      const t = todayStr();
      if(progress.lastCompletedDate !== t){
        progress.streak = (progress.lastCompletedDate === yesterdayStr()) ? progress.streak + 1 : 1;
        progress.lastCompletedDate = t;
      }
    }
  }
  flipped = false;
  saveProgress();
  render(true);
}
function selectCategory(cat){
  deckFilter = cat;
  if(inFocusedSession()){ startFocusedSession(); }
  render();
}
function startFreeMode(){
  freeMode = true;
  startFocusedSession();
  render();
}
function backToDaily(){
  freeMode = false;
  deckFilter = "Semua";
  render();
}
async function resetProgress(){
  if(!confirm("Hapus semua progres dan mulai dari awal?")) return;
  progress = defaultProgress();
  deckFilter = "Semua";
  freeMode = false;
  ensureTodayQueue();
  await saveProgress();
  render();
}
function masteredCount(){
  return Object.values(progress.boxes).filter(b => b === 3).length;
}
function progressCounts(){
  const vals = Object.values(progress.boxes);
  const berkembang = vals.filter(b => b === 2).length;
  const dikuasai = vals.filter(b => b === 3).length;
  return { berkembang, dikuasai };
}

function render(justRated){
  ensureTodayQueue();
  const queueItems = currentQueueItems();
  const doneCount = progress.doneToday.length;
  const cats = getCategories();

  let chipsHtml = ['<button class="chip ' + (deckFilter==="Semua"?"active":"") + '" data-cat="Semua">Semua</button>']
    .concat(cats.map(c => '<button class="chip ' + (deckFilter===c?"active":"") + '" data-cat="' + c.replace(/"/g,'&quot;') + '">' + shortCatLabel(c) + '</button>'))
    .join("");

  let sessionNoteHtml = "";
  if(deckFilter !== "Semua"){
    sessionNoteHtml = `<div class="session-note"><span>Latihan fokus: ${shortCatLabel(deckFilter)}</span><button id="backDailyBtn">Kembali ke target harian</button></div>`;
  } else if(freeMode){
    sessionNoteHtml = `<div class="session-note"><span>Latihan tambahan (bebas)</span><button id="backDailyBtn">Kembali ke ringkasan</button></div>`;
  }

  let stageHtml = "";
  if(queueItems.length === 0 && !inFocusedSession()){
    stageHtml = `
      <div class="done-panel">
        <div class="badge">&#9998;</div>
        <h2>Target hari ini selesai</h2>
        <p>${DAILY_TARGET} kalimat sudah dilatih.<br>Streak kamu sekarang <b>${progress.streak} hari beruntun</b>.<br>${pick(DONE_MSGS)}</p>
        <button class="ghost-btn" id="bonusBtn">Latihan tambahan (bebas)</button>
      </div>
    `;
  } else if(queueItems.length === 0 && inFocusedSession()){
    stageHtml = `
      <div class="done-panel">
        <h2>Deck ini sudah dicoba semua</h2>
        <p>Pilih kategori lain di atas, atau kembali ke target harian.</p>
        <button class="ghost-btn" id="backDailyBtn2">Kembali</button>
      </div>
    `;
  } else {
    const item = queueItems[0];
    const flipClass = flipped ? "flipped" : "";
    const popClass = justRated ? "pop" : "";
    stageHtml = `
      <div class="card ${flipClass} ${popClass}" id="flashcard">
        <div class="card-eyebrow">${shortCatLabel(item.cat)}</div>
        <div class="prompt-block">
          <div class="prompt-word">${item.id_main}</div>
          ${item.id_example ? `<div class="prompt-example">${item.id_example}</div>` : ``}
        </div>
        <div class="card-hint">Ketuk kartu untuk lihat jawaban Inggrisnya</div>
        <div class="card-en">
          <div class="answer-block">
            <div class="en-word">${item.en_word || ""}</div>
            ${item.en_chunk ? `<div class="en-chunk">${item.en_chunk}</div>` : ``}
            <div class="en-sentence">${item.en_sentence}</div>
          </div>
          <div class="speak-row">
            <button class="speak-btn" id="speakNormal">&#128266; Dengarkan</button>
            <button class="speak-btn slow" id="speakSlow">&#8226; Pelan (shadow)</button>
          </div>
        </div>
      </div>
    `;
  }

  let rateRowHtml = "";
  if(queueItems.length > 0){
    rateRowHtml = `
      <div class="rate-row">
        <button class="rate-btn again" id="againBtn" ${!flipped?"disabled":""}>Masih belajar</button>
        <button class="rate-btn got-it" id="gotItBtn" ${!flipped?"disabled":""}>Sudah lancar</button>
      </div>
      <div class="tap-instruction ${justRated?"praise":""}">${justRated ? feedback : (flipped ? "Nilai jawabanmu di atas" : "Coba tebak dulu sebelum membuka kartu")}</div>
    `;
  }

  let dotsHtml = "";
  for(let i=0;i<DAILY_TARGET;i++){
    const cls = i < doneCount ? "filled" : (i === doneCount ? "current" : "");
    dotsHtml += `<div class="dot ${cls}"></div>`;
  }
  const dotsRowHtml = inFocusedSession()
    ? `<div class="dots-label">${queueItems.length} kartu tersisa di deck ini</div>`
    : `<div class="dots">${dotsHtml}</div><div class="dots-label">${doneCount} / ${DAILY_TARGET}</div>`;

  appEl.innerHTML = `
    <header>
      <h1>Kartu Harian</h1>
      <div class="streak"><b>${progress.streak}</b><br>hari beruntun</div>
    </header>

    <div class="dots-row">${dotsRowHtml}</div>

    <div class="chips-wrap"><div class="chips">${chipsHtml}</div></div>

    ${sessionNoteHtml}

    <div class="stage">${stageHtml}</div>

    ${rateRowHtml}

    <footer>
      <span title="Kartu perlu 3x ditandai 'Sudah lancar' untuk dianggap dikuasai penuh">${(() => { const c = progressCounts(); return c.berkembang + " berkembang &middot; " + c.dikuasai + " dikuasai / " + RAW_DATA.length; })()}</span>
      <button class="reset-link" id="resetBtn">reset progres</button>
    </footer>
  `;

  const cardEl = document.getElementById("flashcard");
  if(cardEl){ cardEl.addEventListener("click", () => { flipped = !flipped; render(); }); }
  const speakNormal = document.getElementById("speakNormal");
  if(speakNormal){ speakNormal.addEventListener("click", (e) => { e.stopPropagation(); speak(queueItems[0].en_sentence, 0.95); }); }
  const speakSlow = document.getElementById("speakSlow");
  if(speakSlow){ speakSlow.addEventListener("click", (e) => { e.stopPropagation(); speak(queueItems[0].en_sentence, 0.6); }); }
  const againBtn = document.getElementById("againBtn");
  if(againBtn){ againBtn.addEventListener("click", (e) => { e.stopPropagation(); if(flipped) handleRate(queueItems[0], false); }); }
  const gotItBtn = document.getElementById("gotItBtn");
  if(gotItBtn){ gotItBtn.addEventListener("click", (e) => { e.stopPropagation(); if(flipped) handleRate(queueItems[0], true); }); }
  const bonusBtn = document.getElementById("bonusBtn");
  if(bonusBtn){ bonusBtn.addEventListener("click", startFreeMode); }
  const backDailyBtn = document.getElementById("backDailyBtn");
  if(backDailyBtn){ backDailyBtn.addEventListener("click", backToDaily); }
  const backDailyBtn2 = document.getElementById("backDailyBtn2");
  if(backDailyBtn2){ backDailyBtn2.addEventListener("click", backToDaily); }
  const resetBtn = document.getElementById("resetBtn");
  if(resetBtn){ resetBtn.addEventListener("click", resetProgress); }
  document.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => { selectCategory(chip.getAttribute("data-cat")); });
  });
}

(async function init(){
  progress = await loadProgress();
  ensureTodayQueue();
  await saveProgress();
  render();
})();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
